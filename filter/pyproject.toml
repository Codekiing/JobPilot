[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-filter"
version = "0.1.0"
description = "JobPilot 交互式岗位过滤与最终投递清单组件"
requires-python = ">=3.10"

[project.scripts]
job-filter = "job_filter.cli:main"

[tool.setuptools]
packages = ["job_filter"]
