[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-profile-builder"
version = "0.1.0"
description = "Build a job-matching user profile from JobPilot resume output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
profile-build = "profile_builder.cli:main"

[tool.setuptools.packages.find]
include = ["profile_builder*"]
