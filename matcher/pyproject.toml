[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-matcher"
version = "0.1.0"
description = "JobPilot 本地岗位聚合与用户画像匹配组件"
requires-python = ">=3.10"

[project.scripts]
job-match = "matcher.cli:main"

[tool.setuptools]
packages = ["matcher", "matcher.providers"]
