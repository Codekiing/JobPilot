<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>JobPilot 本地招聘页测试</title>
</head>
<body>
  <h1>示例科技：算法工程师申请</h1>
  <form id="application-form">
    <label>姓名 <input name="candidateName" autocomplete="name"></label>
    <label>电子邮箱 <input type="email" name="email" autocomplete="email"></label>
    <label>手机号码 <input type="tel" name="mobile" autocomplete="tel"></label>
    <label>现居城市 <input name="currentCity"></label>
    <label>最高学历
      <select name="degree">
        <option value="">请选择</option>
        <option>本科</option>
        <option>硕士</option>
        <option>博士</option>
      </select>
    </label>
    <label id="preferred-city-label">意向城市</label>
    <div id="application_preferred_city_list" role="combobox" aria-labelledby="preferred-city-label" tabindex="0" aria-expanded="false">请选择</div>
    <div id="city-options" role="listbox" hidden>
      <button type="button" role="option">北京</button>
      <button type="button" role="option">上海</button>
      <button type="button" role="option">深圳</button>
    </div>
    <label>技能 <textarea name="skills"></textarea></label>
    <label>附件简历 <input id="resume" type="file" accept=".pdf,.doc,.docx"></label>
    <button type="button" id="save">保存草稿</button>
    <button type="submit" id="submit">提交申请</button>
  </form>
  <output id="status">未保存</output>
  <script>
    document.querySelector('#save').addEventListener('click', () => {
      document.querySelector('#status').textContent = '草稿已保存';
    });
    const city = document.querySelector('#application_preferred_city_list');
    const cityOptions = document.querySelector('#city-options');
    city.addEventListener('click', () => {
      cityOptions.hidden = false;
      city.setAttribute('aria-expanded', 'true');
    });
    cityOptions.querySelectorAll('[role=option]').forEach(option => option.addEventListener('click', () => {
      city.textContent = option.textContent;
      city.dataset.value = option.textContent;
      cityOptions.hidden = true;
      city.setAttribute('aria-expanded', 'false');
    }));
    document.querySelector('#application-form').addEventListener('submit', () => {
      document.querySelector('#status').textContent = '错误：发生了提交';
    });
  </script>
</body>
</html>
