[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-filler"
version = "0.1.0"
description = "JobPilot 招聘页面个人信息填充与本地草稿组件"
requires-python = ">=3.10"

[project.optional-dependencies]
browser = ["playwright>=1.50,<2"]

[project.scripts]
job-fill = "filler.cli:main"

[tool.setuptools]
packages = ["filler"]
