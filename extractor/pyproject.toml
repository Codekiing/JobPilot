[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot-resume-splitter"
version = "0.1.0"
description = "Local resume section extraction for PDF, Word, LaTeX and Markdown files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pdfplumber>=0.11,<1",
  "python-docx>=1.1,<2",
]

[project.scripts]
resume-split = "resume_splitter.cli:main"

[tool.setuptools.packages.find]
include = ["resume_splitter*"]
